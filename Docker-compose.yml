
services:
  # 🔥 API .NET
  api:
    build:
      context: .
      dockerfile: src/TaskList.API/Dockerfile
    container_name: tasklist-api
    ports:
      - "8080:80"
      - "8081:443"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=TaskListDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
    networks:
      - tasklist-network
    restart: unless-stopped

  # 🔥 SQL Server
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tasklist-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - tasklist-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  sql_data:

networks:
  tasklist-network:
    driver: bridge