name: Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - dev

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Necessário para alguns analisadores

      - name: ⚙️ Configurar .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # acelera builds
      - name: 💾 Cache do NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 📦 Restaurar dependências
        run: dotnet restore TaskList.sln

      - name: 🔨 Build (Release)
        run: dotnet build TaskList.sln --no-restore --configuration Release

      - name: 🧪 Executar testes com cobertura
        run: |
          dotnet test TaskList.sln \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      # mesmo se falhar
      - name: 📊 Publicar resultados dos testes
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Resultados dos Testes
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx

      - name: 📈 Upload da cobertura
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura-testes
          path: '**/TestResults/**/coverage.cobertura.xml'
          retention-days: 7     
  docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test          # 🔥 Só roda se os testes passarem
    if: github.event_name == 'push' # 🔥 Só em push (não em PR)

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: 🔨 Build da imagem Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false            # 🔥 Mude para true se for publicar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }} 
          cache-from: type=gha
          cache-to: type=gha,mode=max
        